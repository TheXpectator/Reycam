name: Build
on:
  push:
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneWebcam-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  windows:
    needs: android
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      # APK dari job sebelumnya, dibundel ke dalam .exe
      - uses: actions/download-artifact@v4
        with:
          name: PhoneWebcam-apk
          path: windows

      - name: Siapkan adb (Android platform-tools resmi dari Google)
        shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile pt.zip
          Expand-Archive pt.zip -DestinationPath .
          New-Item -ItemType Directory -Force windows\adb | Out-Null
          Copy-Item platform-tools\adb.exe windows\adb\
          Copy-Item platform-tools\*.dll windows\adb\
          if (-not (Test-Path windows\adb\adb.exe)) { throw "adb.exe tidak ditemukan" }

      - name: Siapkan kamera virtual (Unity Capture, lisensi MIT)
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/schellingb/UnityCapture.git uc
          New-Item -ItemType Directory -Force windows\unitycapture | Out-Null
          Copy-Item uc\Install\* windows\unitycapture\ -Recurse
          if (-not (Test-Path windows\unitycapture\Install.bat)) { throw "Install.bat Unity Capture tidak ditemukan" }
          if (-not (Test-Path windows\unitycapture\UnityCaptureFilter64.dll)) { throw "UnityCaptureFilter64.dll tidak ditemukan" }

      - run: pip install opencv-python-headless numpy pyvirtualcam pyinstaller

      - name: Build exe
        working-directory: windows
        shell: pwsh
        run: >
          pyinstaller --onefile --noconsole --name PhoneWebcam
          --add-data "adb;adb"
          --add-data "unitycapture;unitycapture"
          --add-data "app-debug.apk;."
          webcam_pc.py

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneWebcam-exe
          path: windows/dist/PhoneWebcam.exe
